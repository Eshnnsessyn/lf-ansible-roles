---
# tasks file for push_ssh_pub
- name: add .ssh folder in ~/ for {{ username }}
  ansible.builtin.file:
    path: /home/{{ username }}/.ssh
    state: directory
    mode: '0700'
    owner: '{{ username }}'
    group: '{{ username }}'
- name: add 'authorized_keys' in ~/.ssh for {{ username }}
  ansible.posix.authorized_key:
    user: '{{ username }}'
    state: present
    key: "{{ lookup('file', item) }}"
  loop: '{{ key_paths }}'
